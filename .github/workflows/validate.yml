name: Validate Windows PowerShell package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tracked release files with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'package-source.zip'
          $stage = Join-Path $env:RUNNER_TEMP 'package-validation'
          git archive --format=zip --output=$zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git archive failed' }
          Expand-Archive -LiteralPath $zip -DestinationPath $stage
          & (Join-Path $stage 'Test-PCMigrationPackage-v4.1.0.ps1') -PackagePath $stage -StrictPackageContents
